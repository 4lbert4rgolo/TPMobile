name: Deploy para o Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  # Só publica se os testes passarem: um teste que falha trava a publicação.
  testes:
    name: Testes antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Instala só as bibliotecas do app (Excel) e copia para public/vendor.
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run verificar

  build_and_deploy:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      # Bibliotecas de Excel servidas pelo próprio site: copia de node_modules para public/vendor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bibliotecas do app
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TPMOBILE_81727 }}'
          channelId: live
          projectId: tpmobile-81727