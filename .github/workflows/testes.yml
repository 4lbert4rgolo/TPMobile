name: Testes

# Roda a cada envio e a cada pull request, em qualquer branch.
# - "unitarios": regras de montagem da escala, retenção de dados etc. (rápido)
# - "regras": regras de segurança do Firestore, no emulador (precisa de Java)

on:
  push:
  pull_request:

jobs:
  unitarios:
    name: Testes do código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run verificar

  regras:
    name: Regras de segurança do Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run test:regras
